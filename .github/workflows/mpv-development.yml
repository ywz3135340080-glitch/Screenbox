name: Screenbox mpv x64 preview

on:
  push:
    branches: [codex/mpv-backend]
    paths-ignore:
      - 'scripts/mpv-preview/**'
      - '.github/workflows/mpv-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenbox-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Locate Visual Studio 2026 MSBuild
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $buildTool = & $vswhere -version "[18.0,19.0)" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $buildTool) { throw "Visual Studio 2026 MSBuild was not found." }
          "SCREENBOX_MSBUILD=$buildTool" >> $env:GITHUB_ENV

      - name: Publish mpv renderer worker
        run: |
          & $env:SCREENBOX_MSBUILD Screenbox.MpvBridge/Screenbox.MpvBridge.csproj -restore -t:Publish -m -v:minimal -p:Configuration=Release -p:Platform=x64 "-p:PublishDir=$env:GITHUB_WORKSPACE/artifacts/MpvBridge/"
          if ($LASTEXITCODE -ne 0) { throw "Native renderer worker build failed." }

      - name: Verify native child window, bounds, popup cutouts and cleanup
        run: |
          $process = Start-Process -FilePath "artifacts/MpvBridge/Screenbox.MpvBridge.exe" -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The native video surface self-test failed." }

      - name: Configure unsigned development package
        run: |
          ./scripts/Update-AppxManifest.ps1 -Identity SideloadUnsigned
          [xml]$manifest = Get-Content Screenbox/Package.appxmanifest -Raw
          $manifest.Package.Identity.Name = "Screenbox.MpvPreview"
          $manifest.Package.Identity.Version = "0.1.0.$env:GITHUB_RUN_NUMBER"
          $manifest.Package.Properties.DisplayName = "Screenbox mpv Preview"
          $manifest.Package.Applications.Application.VisualElements.DisplayName = "Screenbox mpv Preview"
          $manifest.Save((Join-Path $PWD "Screenbox/Package.appxmanifest"))

      - name: Restore and build x64 application
        run: |
          & $env:SCREENBOX_MSBUILD Screenbox/Screenbox.csproj -restore -m -v:minimal -bl:screenbox-build.binlog -p:Configuration=Release -p:Platform=x64 -p:RestoreConfigFile=nuget.config -p:ContinuousIntegrationBuild=true -p:AppxBundle=Never -p:AppxBundlePlatforms=x64 -p:AppxPackageSigningEnabled=false -p:UapAppxPackageBuildMode=SideloadOnly
          if ($LASTEXITCODE -ne 0) { throw "Application build failed with exit code $LASTEXITCODE." }

      - name: Build automated tests
        run: |
          & $env:SCREENBOX_MSBUILD Screenbox.Core.Tests/Screenbox.Core.Tests.csproj -restore -m -v:minimal -p:Configuration=Release -p:Platform=x64 "-p:OutDir=$env:RUNNER_TEMP\ScreenboxTests\"
          if ($LASTEXITCODE -ne 0) { throw "Test build failed with exit code $LASTEXITCODE." }

      - name: Run automated tests
        run: |
          & "$env:RUNNER_TEMP\ScreenboxTests\Screenbox.Core.Tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE." }

      - name: Create preview installation kit
        run: ./scripts/Export-MpvPreviewKit.ps1

      - name: Install and launch the actual packaged player
        run: |
          Expand-Archive -LiteralPath artifacts/ScreenboxMpvPreview-x64.zip -DestinationPath artifacts/startup-payload
          $env:SCREENBOX_KIT_DIR = (Resolve-Path artifacts/startup-payload).Path
          & powershell.exe -NoLogo -NoProfile -NonInteractive -File scripts/mpv-preview/InstallEngine.ps1
          if ($LASTEXITCODE -ne 0) { throw "Player deployment failed." }
          ./scripts/mpv-preview/Test-PlayerStartup.ps1

      - name: Verify runtime reuse and missing-dependency selection
        run: ./scripts/mpv-preview/Test-SetupEngine.ps1 -Payload artifacts/ScreenboxMpvPreview-x64.zip

      - name: Build graphical installer
        run: ./scripts/mpv-preview/Build-Setup.ps1 -SourceCommit $env:GITHUB_SHA

      - name: Verify graphical installer and render interface
        run: |
          $installer = Join-Path $PWD "artifacts/ScreenboxMpvPreview-Setup.exe"
          $test = Start-Process -FilePath $installer -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Graphical installer payload self-test failed." }
          $preview = Join-Path $PWD "artifacts/setup-preview.png"
          $render = Start-Process -FilePath $installer -ArgumentList @("--render", $preview) -WindowStyle Hidden -Wait -PassThru
          if ($render.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $preview)) { throw "Graphical installer rendering failed." }

      - name: Upload graphical installer
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ScreenboxMpvPreview-Setup.exe
          archive: false
          retention-days: 30

      - name: Upload preview installation kit
        uses: actions/upload-artifact@v7
        with:
          name: screenbox-mpv-internal-payload
          path: artifacts/ScreenboxMpvPreview-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenbox-build-diagnostics
          path: |
            screenbox-build.binlog
            artifacts/setup-preview.png
            setup-selftest.txt
            artifacts/startup-check/**
            Screenbox/bin/**/Screenbox.pdb
          if-no-files-found: ignore
          retention-days: 7
